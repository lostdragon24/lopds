name: Build RPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    # Используем официальный контейнер Fedora, где есть все утилиты для RPM
    container:
      image: fedora:latest

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git make gcc rpm-build rpmdevtools

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare RPM build directories
        run: |
          rpmdev-setuptree
          # Создаем архив с исходным кодом, как того требует rpmbuild
          # Заменяем 'lopds-scanner' на имя вашего пакета, если необходимо
          PROJECT_NAME="lopds-scanner"
          VERSION=${GITHUB_REF_NAME#v} # Извлекает '1.0.0' из тега 'v1.0.0'
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then VERSION="0.0.1"; fi
          
          mkdir -p "/tmp/${PROJECT_NAME}-${VERSION}"
          cp -r scanner/* "/tmp/${PROJECT_NAME}-${VERSION}/"
          cd /tmp && tar --exclude='.git' -czf "${HOME}/rpmbuild/SOURCES/${PROJECT_NAME}-${VERSION}.tar.gz" "${PROJECT_NAME}-${VERSION}"

      - name: Create RPM Spec File
        run: |
          # Динамически создаем .spec файл для сборки
          PROJECT_NAME="lopds-scanner"
          VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then VERSION="0.0.1"; fi

          cat << 'EOF' > ${HOME}/rpmbuild/SPECS/${PROJECT_NAME}.spec
          Name:           lopds-scanner
          Version:        %{_version}
          Release:        1%{?dist}
          Summary:        Scanner component for lopds
          License:        MIT
          URL:            https://github.com/lostdragon24/lopds
          Source0:        %{name}-%{version}.tar.gz

          BuildRequires:  make, gcc

          %description
          Scanner component written in pure C for the lopds project.

          %prep
          %setup -q

          %build
          # Здесь вызывается ваш Makefile внутри директории scanner
          make %{?_smp_mflags}

          %install
          rm -rf $RPM_BUILD_ROOT
          # Создаем директорию в фиктивном корне для установки бинарника
          mkdir -p $RPM_BUILD_ROOT%{_bindir}
          # Корректируйте имя исполняемого файла, если в Makefile оно другое (например, lopds-scanner)
          install -m 755 scanner $RPM_BUILD_ROOT%{_bindir}/lopds-scanner

          %files
          %{_bindir}/lopds-scanner

          %changelog
          * Sun Sep 20 2026 GitHub Actions <actions@github.com> - %{_version}-1
          - Automated RPM build
          EOF
          
          # Заменяем макрос версии на реальное значение из GitHub
          sed -i "s/%{_version}/${VERSION}/g" ${HOME}/rpmbuild/SPECS/${PROJECT_NAME}.spec

      - name: Build RPM
        run: |
          rpmbuild -ba ${HOME}/rpmbuild/SPECS/lopds-scanner.spec

      - name: Upload Artifacts
        uses: actions/artifacts-upload@v4
        with:
          name: lopds-scanner-rpm
          path: /root/rpmbuild/RPMS/*/*.rpm
